[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "width-function-algorithms"
version = "0.1.0"
description = "Geometric Properties and Computation of the Width Function with Real-World Applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
experiment = [
  "matplotlib>=3.8",
]
deployment = [
  "opencv-python-headless>=4.10",
  "ultralytics>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
